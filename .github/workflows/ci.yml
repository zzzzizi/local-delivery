name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: delivery_ci
          POSTGRES_USER: delivery_ci
          # Disposable CI service only; never a deployed database credential.
          POSTGRES_PASSWORD: ci-only-ephemeral-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U delivery_ci -d delivery_ci"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: delivery_ci
      DB_USERNAME: delivery_ci
      DB_PASSWORD: ci-only-ephemeral-password
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify Java application
        working-directory: backend
        run: sh mvnw -B -ntp clean verify
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8080/api
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  docker:
    name: Docker integration
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Validate deployment configuration
        run: node scripts/test-deployment.mjs
      - name: Verify full Docker application on isolated data
        run: node scripts/test-docker.mjs
