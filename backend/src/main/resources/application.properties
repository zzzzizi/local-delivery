spring.application.name=local-delivery
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
server.address=127.0.0.1
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:${POSTGRES_HOST:127.0.0.1}}:${DB_PORT:${POSTGRES_PORT:5433}}/${DB_NAME:${POSTGRES_DB:local_delivery}}
spring.datasource.username=${DB_USERNAME:${POSTGRES_USER:local_delivery}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:}}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.data-source-properties.connectTimeout=5
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Bind LocalDateTime directly so the JVM timezone cannot shift stored UTC values.
spring.jpa.properties.hibernate.type.java_time_use_direct_jdbc=true
spring.flyway.baseline-version=1

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-numbers-for-enums=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/api/openapi.json
app.seed-demo-users=${SEED_DEMO_USERS:false}

server.servlet.session.timeout=30m
server.servlet.session.cookie.name=DELIVERY_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.path=/
server.servlet.session.tracking-modes=cookie

# SMTP is captured by Mailpit in local Compose; trial deployment supplies a real SMTP service.
app.public-base-url=${PUBLIC_BASE_URL:http://127.0.0.1:3000}
app.mail-from=${MAIL_FROM:noreply@local-delivery.test}
app.accounts.require-verification=true
app.accounts.mail-enabled=true
app.accounts.rate-limit-enabled=true
spring.mail.host=${SMTP_HOST:127.0.0.1}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
