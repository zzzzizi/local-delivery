name: local-delivery

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-${POSTGRES_DB:-local_delivery}}
      POSTGRES_USER: ${DB_USERNAME:-${POSTGRES_USER:-local_delivery}}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-}}
    ports:
      - "127.0.0.1:${DB_PORT:-${POSTGRES_PORT:-5433}}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
